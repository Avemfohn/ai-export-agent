services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiexportagent
      POSTGRES_USER: aiexportagent
      POSTGRES_PASSWORD: aiexportagent_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiexportagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aiexportagent
      SPRING_DATASOURCE_USERNAME: aiexportagent
      SPRING_DATASOURCE_PASSWORD: aiexportagent_dev
      DEV_TENANT_ID: 00000000-0000-0000-0000-000000000001
      # AI Lead Scoring (Phase 2): defaults to the mock provider, no key
      # needed. Set AI_PROVIDER to openai/anthropic + the matching API key
      # below to switch to a real provider — no code changes required.
      AI_PROVIDER: mock
      AI_MATCH_THRESHOLD: "60"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      # Automated approve -> draft -> send pipeline: defaults to the mock
      # email provider, no key needed. Set EMAIL_PROVIDER=mailgun + the
      # MAILGUN_* vars below to actually send. Conservative pacing by
      # default (~1 email/60s) via EMAIL_SEND_INTERVAL_MS/EMAIL_SEND_BATCH_SIZE.
      EMAIL_PROVIDER: mock
      MAILGUN_API_KEY: ""
      MAILGUN_DOMAIN: ""
      # Trade-fair upload writes to the SHARED supplier pool and there is no
      # login yet, so it ships disabled and is turned on explicitly here for
      # local development. Do NOT default this to true on a public deployment.
      UPLOAD_ENABLED: "true"
      # Placeholder for future integration, unused in Sprint 1 (mock data only):
      APIFY_TOKEN: ""
    ports:
      # Host 8000, container 8080. Windows reserves the 8054-8153 range for
      # Hyper-V/WinNAT, so binding 8080 on the host fails with "an attempt was
      # made to access a socket in a way forbidden by its access permissions"
      # even though nothing is using it. Only the host side moves: the
      # container still listens on 8080, so INTERNAL_API_BASE_URL below and the
      # Railway deployment are unaffected.
      - "8000:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Used by BOTH server-side fetches and the /api/* rewrite in
      # next.config.ts: "localhost" inside this container is the frontend
      # itself, not the backend, so it must go via the Compose service name.
      #
      # The browser never needs a backend URL — it calls this app's own origin
      # and the rewrite forwards. Do not reintroduce NEXT_PUBLIC_API_BASE_URL
      # here; it would point browsers at the visitor's own machine once this
      # runs anywhere but your laptop.
      INTERNAL_API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
