services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiexportagent
      POSTGRES_USER: aiexportagent
      POSTGRES_PASSWORD: aiexportagent_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiexportagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aiexportagent
      SPRING_DATASOURCE_USERNAME: aiexportagent
      SPRING_DATASOURCE_PASSWORD: aiexportagent_dev
      DEV_TENANT_ID: 00000000-0000-0000-0000-000000000001
      # Placeholders for future integrations, unused in Sprint 1 (mock data only):
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      APIFY_TOKEN: ""
      MAILGUN_API_KEY: ""
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
