server:
  # PORT is injected by most container platforms (Railway among them); the
  # default keeps docker-compose and local runs on the published 8080.
  port: ${PORT:8080}
  # Railway's private network is IPv6-only, and Spring Boot binds IPv4 by
  # default — so a backend reached only over that network must be started with
  # SERVER_ADDRESS=::, or peer services get connection-refused and it looks
  # like the app failed to boot rather than a binding mismatch.
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: ai-export-agent-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Hardcoded dev tenant id used by TenantContextFilter until real tenant login
# exists (see CLAUDE.md, Sprint 1 status). Overridable via DEV_TENANT_ID env var.
app:
  dev-tenant-id: ${DEV_TENANT_ID:00000000-0000-0000-0000-000000000001}
  ai:
    # mock | openai | anthropic — see CLAUDE.md "AI Lead Scoring". Defaults to
    # mock so the scoring flow works out of the box with no API key.
    provider: ${AI_PROVIDER:mock}
    match-threshold: ${AI_MATCH_THRESHOLD:60}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
  email:
    # mock | mailgun — see CLAUDE.md automated outreach pipeline. Defaults to
    # mock so the queue-and-send flow works out of the box with no API key.
    provider: ${EMAIL_PROVIDER:mock}
    # How often the queueing/sending schedulers tick, and how many QUEUED
    # emails the sender picks up per tick — defaults reproduce a conservative
    # ~1 email/60s pace, safe for a sending domain with no reputation yet.
    queue-interval-ms: ${EMAIL_QUEUE_INTERVAL_MS:60000}
    send-interval-ms: ${EMAIL_SEND_INTERVAL_MS:60000}
    send-batch-size: ${EMAIL_SEND_BATCH_SIZE:1}
    mailgun:
      api-key: ${MAILGUN_API_KEY:}
      domain: ${MAILGUN_DOMAIN:}
      from-address: ${MAILGUN_FROM_ADDRESS:}
