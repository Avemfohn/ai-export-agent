server:
  # PORT is injected by most container platforms (Railway among them); the
  # default keeps docker-compose and local runs on the published 8080.
  port: ${PORT:8080}
  # Railway's private network is IPv6-only, and Spring Boot binds IPv4 by
  # default — so a backend reached only over that network must be started with
  # SERVER_ADDRESS=::, or peer services get connection-refused and it looks
  # like the app failed to boot rather than a binding mismatch.
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: ai-export-agent-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Spring's default max-file-size is 1MB, which a real exhibitor workbook
      # exceeds — without this the first genuine upload fails. Oversized files
      # are turned into a clean 400 by GlobalExceptionHandler; there is no
      # catch-all handler, so without that they would surface as a bare 500.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
  jpa:
    properties:
      hibernate:
        jdbc:
          # Batching matters for the chunked upload insert path. Safe globally:
          # ids come from @GeneratedValue(UUID) generated in memory, so batching
          # actually engages (IDENTITY would silently disable it), and every
          # other write path is either a single save or an unguarded loop, so
          # moving constraint failures from save() to flush changes nothing.
          batch_size: 100
        order_inserts: true
        order_updates: true

# Hardcoded dev tenant id used by TenantContextFilter until real tenant login
# exists (see CLAUDE.md, Sprint 1 status). Overridable via DEV_TENANT_ID env var.
app:
  dev-tenant-id: ${DEV_TENANT_ID:00000000-0000-0000-0000-000000000001}
  ai:
    # mock | openai | anthropic — see CLAUDE.md "AI Lead Scoring". Defaults to
    # mock so the scoring flow works out of the box with no API key.
    provider: ${AI_PROVIDER:mock}
    match-threshold: ${AI_MATCH_THRESHOLD:60}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
  email:
    # mock | mailgun — see CLAUDE.md automated outreach pipeline. Defaults to
    # mock so the queue-and-send flow works out of the box with no API key.
    provider: ${EMAIL_PROVIDER:mock}
    # How often the queueing/sending schedulers tick, and how many QUEUED
    # emails the sender picks up per tick — defaults reproduce a conservative
    # ~1 email/60s pace, safe for a sending domain with no reputation yet.
    queue-interval-ms: ${EMAIL_QUEUE_INTERVAL_MS:60000}
    send-interval-ms: ${EMAIL_SEND_INTERVAL_MS:60000}
    send-batch-size: ${EMAIL_SEND_BATCH_SIZE:1}
    mailgun:
      api-key: ${MAILGUN_API_KEY:}
      domain: ${MAILGUN_DOMAIN:}
      from-address: ${MAILGUN_FROM_ADDRESS:}
  outreach:
    # A contact scoring below this is never selected for automated outreach.
    # Trade-fair uploads store freemail contacts at 0.30 precisely so they land
    # under it — see SupplierUploadService. Seeded contacts are 0.600-0.910, so
    # this default changes nothing that already worked.
    min-contact-confidence: ${OUTREACH_MIN_CONTACT_CONFIDENCE:0.50}
  upload:
    # Trade-fair upload writes into the SHARED supplier pool, and there is no
    # login yet (see CLAUDE.md Sprint 1 status). Off by default so a publicly
    # reachable deployment cannot have its core data asset written to by
    # strangers — same posture as the mock AI/email providers above. Local dev
    # turns it on in docker-compose.
    enabled: ${UPLOAD_ENABLED:false}
    max-rows: ${UPLOAD_MAX_ROWS:5000}
    chunk-size: ${UPLOAD_CHUNK_SIZE:500}
